<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Owner Admin</title>
<style>
:root{--p:#111;--a:#0b4fd8;--line:#e4e2de;--mut:#6b6b68}
*{box-sizing:border-box}body{margin:0;background:#f0f0ee;color:var(--p);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}:focus-visible{outline:0;box-shadow:0 0 0 3px rgba(11,79,216,.3)}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--p);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
nav{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:48px;z-index:9}
nav button{flex:none;padding:12px 16px;border:0;background:none;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}nav button.on{border-color:var(--a);color:var(--a);font-weight:600}
main{max-width:960px;margin:0 auto;padding:14px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.btn{background:var(--p);color:#fff;border:1px solid var(--p);padding:9px 18px;cursor:pointer;border-radius:99px;transition:.15s}.btn:hover{opacity:.86}.btn:active{transform:scale(.98)}.btn.a{background:var(--a);border-color:var(--a)}.btn.o{background:#fff;color:var(--p);border-color:var(--p)}.btn.r{background:#c4261d;border-color:#c4261d}.btn.s{padding:5px 10px;font-size:13px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;margin:3px 0 10px}input:focus,select:focus,textarea:focus{border-color:var(--a);outline:0;box-shadow:0 0 0 3px rgba(11,79,216,.2)}input[type=checkbox]{width:auto;margin:0 6px 0 0}input[type=color]{padding:2px;height:38px}input[type=file]{padding:6px}
label{font-size:13px;color:var(--mut)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.pi{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.pi img{width:54px;height:66px;object-fit:cover;background:#eee;border-radius:8px}.pi>div{flex:1}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.imgs div{position:relative}.imgs img,.imgs video{width:84px;height:104px;object-fit:cover;background:#000;display:block}.imgs .c{display:flex;gap:2px;margin-top:2px}.imgs .c button{flex:1;padding:2px;font-size:12px;border:1px solid var(--line);background:#fff;cursor:pointer}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;overflow:auto;padding:14px;display:none}.mod.on{display:block}.mod>div{background:#fff;max-width:720px;margin:0 auto;padding:18px;border-radius:16px}
.tag{display:inline-block;padding:2px 8px;font-size:12px;background:#eee;margin-right:4px}.tag.g{background:#dff3e5}.tag.y{background:#fdf0cc}.tag.b{background:#dde9fb}.tag.x{background:#f9d9d6}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}.stat div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}.stat b{font-size:22px;display:block}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--p);color:#fff;padding:10px 18px;opacity:0;transition:.3s;z-index:99;pointer-events:none}.toast.on{opacity:1}
.lay{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fafaf8}.lay .ctl{display:flex;flex-direction:column;gap:4px}.lay>div:nth-child(2){flex:1}
.err{color:#b3261e}.mut{color:var(--mut);font-size:13px}
@media(max-width:560px){.g2,.g3{grid-template-columns:1fr}}
</style></head><body>
<div id="login" style="max-width:340px;margin:12vh auto;padding:20px" class="box"><h2 style="margin-top:0">Owner login</h2><label>Username</label><input id="lu" value="owner" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button class="btn" style="width:100%" onclick="login()">Login</button><div class="err" id="le"></div></div>
<div id="panel" style="display:none"><header><b>⚙ Owner Admin</b><span><button class="btn a s" style="margin-right:8px" onclick="sessionStorage.setItem('edit','1');location.href='/'">✎ Edit shop live</button><a href="/" style="color:#fff;margin-right:14px">View shop ↗</a><button class="btn a s" onclick="logout()">Logout</button></span></header>
<nav id="nav"></nav><main id="main"></main></div>
<div class="mod" id="mod"><div id="modc"></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let T=sessionStorage.getItem('t')||'',A=null,tab='orders',ed=null;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)};
async function api(u,m='GET',b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(r.status===401&&u!=='/api/admin/login'){logout();throw new Error('Session expired')}if(!r.ok)throw new Error(j.error||'Error');return j}
async function login(){try{const r=await api('/api/admin/login','POST',{user:$('#lu').value,pass:$('#lp').value});T=r.token;sessionStorage.setItem('t',T);start()}catch(e){$('#le').textContent=e.message}}
function logout(){T='';sessionStorage.removeItem('t');$('#panel').style.display='none';$('#login').style.display='';$('#lp').value=''}
async function start(){try{A=await api('/api/admin/all');$('#login').style.display='none';$('#panel').style.display='';render();hashGo()}catch(e){}}
function hashGo(){const h=location.hash;if(h==='#new'){tab='products';render();editP()}else if(h.startsWith('#p=')&&A.products.find(x=>x.id===h.slice(3))){tab='products';render();editP(h.slice(3))}else if(h==='#cats'){tab='categories';render()}}
const TABS=[['orders','Orders'],['customers','Customers'],['products','Products'],['categories','Categories'],['layout','App Layout'],['reviews','Reviews'],['offers','Offers'],['settings','Settings']];
function render(){$('#nav').innerHTML=TABS.map(([k,n])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';render()">${n}</button>`).join('');({orders,customers,products,categories,layout,reviews,offers,settings}[tab])()}
const money=n=>(A.settings.currency||'₹')+Number(n).toLocaleString('en-IN');
const catName=id=>A.categories.find(c=>c.id===id)?.name||'—';
const fileData=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
async function shrink(f,max=1400){if(!f.type.startsWith('image/')||f.type==='image/gif')return fileData(f);const u=await fileData(f);return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.85))};i.onerror=()=>r(u);i.src=u})}
async function upload(files){const out=[];for(const f of files){try{const d=await shrink(f);const r=await api('/api/admin/upload','POST',{data:d});out.push(r.url)}catch(e){toast(f.name+': '+e.message)}}return out}
// ---- orders ----
const ST=['placed','confirmed','shipped','delivered','cancelled'],PS=['pending','verify','paid','failed'];
function orders(){const O=A.orders,rev=O.filter(o=>o.payment.status==='paid').reduce((a,o)=>a+o.total,0);
 $('#main').innerHTML=`<div class="stat"><div><b>${O.length}</b>Orders</div><div><b>${O.filter(o=>o.status==='placed').length}</b>New</div><div><b>${O.filter(o=>o.payment.status==='verify').length}</b>Payments to verify</div><div><b>${money(rev)}</b>Paid revenue</div></div>`+
 (O.length?O.map(o=>{const c=o.customer;return `<div class="box"><div class="row sp"><b>${esc(o.id)}</b><span class="mut">${new Date(o.date).toLocaleString()}</span></div>
 <div>${o.items.map(i=>`${esc(i.name)} ${i.size?'('+esc(i.size)+')':''} × ${i.qty}`).join('<br>')}</div>
 <div style="margin:6px 0"><b>${money(o.total)}</b> <span class="mut">(sub ${money(o.subtotal)}${o.discount?', −'+money(o.discount)+' '+esc(o.coupon):''}, ship ${money(o.shipping)})</span></div>
 <div><b>${esc(c.name)}</b>${c.accountName&&c.accountName!==c.name?' <span class="mut">(account: '+esc(c.accountName)+')</span>':''} · <a href="tel:${esc(c.phone)}">${esc(c.phone)}</a> · <a href="https://wa.me/91${esc(c.phone)}" target="_blank">WhatsApp</a>${c.altPhone?' · Extra: <a href="tel:'+esc(c.altPhone)+'">'+esc(c.altPhone)+'</a>':''}<br>${esc(c.line1)}${c.line2?', '+esc(c.line2):''}, ${esc(c.city)}, ${esc(c.state)} ${esc(c.pincode)}${c.pin?` · <a target="_blank" href="https://www.google.com/maps?q=${c.pin.lat},${c.pin.lng}">📍 Open pinned location</a>`:''}</div>
 ${o.note?`<div class="mut">Note: ${esc(o.note)}</div>`:''}
 <div class="mut" style="margin:6px 0">Payment: ${esc(o.payment.method.toUpperCase())}${o.payment.utr?' · UTR: <b>'+esc(o.payment.utr)+'</b>':''}</div>
 ${o.payment.status!=='paid'&&o.payment.method==='upi'?`<button class="btn a s" style="margin-bottom:8px" onclick="markPaid('${o.id}')">✔ Mark payment received</button>`:''}
 <div class="g2"><div><label>Order status</label><select onchange="setO('${o.id}',{status:this.value})">${ST.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Payment status</label><select onchange="setO('${o.id}',{payStatus:this.value})">${PS.map(s=>`<option ${s===o.payment.status?'selected':''}>${s}</option>`).join('')}</select></div></div></div>`}).join(''):'<div class="box mut">No orders yet.</div>')}
async function markPaid(id){await setO(id,{payStatus:'paid',status:'confirmed'});orders()}
async function setO(id,b){try{const o=await api('/api/admin/order/'+id,'PUT',b);const i=A.orders.findIndex(x=>x.id===id);A.orders[i]=o;toast('Updated')}catch(e){toast(e.message)}}
// ---- customers ----
let CU=[],cuf='all',cuq='';
const ago=t=>{if(!t)return '—';const m=Math.round((Date.now()-t)/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' hr ago':Math.round(m/1440)+' day'+(Math.round(m/1440)>1?'s':'')+' ago'};
async function customers(){$('#main').innerHTML='<div class="box mut">Loading customers…</div>';try{CU=await api('/api/admin/customers')}catch(e){$('#main').innerHTML='<div class="box err">'+esc(e.message)+'</div>';return}
 $('#main').innerHTML=`<div class="stat" id="cus"></div><div class="row" style="margin-bottom:10px"><input id="cuq" placeholder="Search name or number" style="flex:2;margin:0" oninput="cuq=this.value;drawCU()"><select id="cuf" style="flex:1;margin:0" onchange="cuf=this.value;drawCU()"><option value="all">All customers</option><option value="bought">Bought something</option><option value="never">Logged in, never bought</option><option value="cart">Has items in cart</option><option value="online">Online now</option></select><button class="btn o s" onclick="customers()">↻ Refresh</button></div><div id="cul"></div>`;
 $('#cuf').value=cuf;$('#cuq').value=cuq;drawCU()}
function drawCU(){const q=cuq.toLowerCase().trim();
 $('#cus').innerHTML=`<div><b>${CU.length}</b>Customers</div><div><b>${CU.filter(c=>c.orders>0).length}</b>Bought</div><div><b>${CU.filter(c=>!c.orders).length}</b>Never bought</div><div><b>${CU.filter(c=>c.online).length}</b>Online now</div>`;
 const L=CU.filter(c=>(cuf==='all'||(cuf==='bought'&&c.orders>0)||(cuf==='never'&&!c.orders)||(cuf==='cart'&&c.cart.length)||(cuf==='online'&&c.online))&&(!q||c.phone.includes(q)||(c.name||'').toLowerCase().includes(q)));
 $('#cul').innerHTML=L.length?L.map(c=>`<div class="box"><div class="row sp"><b>${esc(c.name||'(no name yet)')} · <a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></b><span>${c.online?'<span class="tag g">● online</span>':''}${c.orders?'<span class="tag b">Buyer</span>':'<span class="tag y">Not bought yet</span>'}</span></div>
 <div class="mut" style="margin:4px 0"><a target="_blank" href="https://wa.me/91${esc(c.phone)}">WhatsApp</a>${c.altPhone?' · Extra no: <a href="tel:'+esc(c.altPhone)+'">'+esc(c.altPhone)+'</a>':''}</div>
 <div>Logins: <b>${c.logins}</b> · First: ${c.firstLogin?new Date(c.firstLogin).toLocaleDateString():'—'} · Last seen: <b>${ago(Math.max(c.lastActive,c.lastLogin))}</b></div>
 <div>Orders: <b>${c.orders}</b> · Ordered value: <b>${money(c.spent)}</b> · Paid: <b>${money(c.paid)}</b></div>
 <div style="margin-top:6px"><b>Bought:</b> ${c.bought.length?c.bought.map(esc).join(', '):'<span class="mut">nothing yet</span>'}</div>
 ${c.cart.length?`<div style="margin-top:4px"><b>In cart, not bought:</b> ${c.cart.map(i=>esc(i.name)+(i.size?' ('+esc(i.size)+')':'')+' × '+i.qty).join(', ')} <span class="mut">(${ago(c.cartAt)})</span></div>`:''}
 ${c.address?`<div class="mut" style="margin-top:4px">📍 ${esc(c.address)}${c.addresses>1?' (+'+(c.addresses-1)+' more saved)':''}</div>`:''}</div>`).join(''):'<div class="box mut">No customers match.</div>'}
// ---- products ----
function products(){$('#main').innerHTML=`<div class="row sp" style="margin-bottom:10px"><b>${A.products.length} products</b><button class="btn a" onclick="editP()">+ Add product</button></div><div class="box">${A.products.map(p=>`<div class="pi"><img src="${esc(p.images[0]||'')}"><div><b>${esc(p.name)}</b> ${p.active?'':'<span class="tag x">hidden</span>'}${p.featured?'<span class="tag y">featured</span>':''}<div class="mut">${esc(catName(p.category))} · ${money(p.price)} · stock ${p.stock}</div></div><button class="btn o s" onclick="editP('${p.id}')">Edit</button></div>`).join('')||'<span class="mut">No products</span>'}</div>`}
function editP(id){const p=id?JSON.parse(JSON.stringify(A.products.find(x=>x.id===id))):{name:'',category:A.categories[0]?.id||'',price:0,mrp:0,images:[],videos:[],description:'',details:[{k:'Material',v:''},{k:'Length',v:''}],sizes:['S','M','L','XL'],stock:10,featured:false,active:true};ed=p;pform()}
function pform(){const p=ed;$('#modc').innerHTML=`<div class="row sp"><h3 style="margin:0">${p.id?'Edit':'New'} product</h3><button class="btn o s" onclick="closeM()">✕</button></div>
 <label>Name</label><input id="pn" value="${esc(p.name)}"><div class="g2"><div><label>Category</label><select id="pc">${A.categories.map(c=>`<option value="${c.id}" ${c.id===p.category?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div><label>Stock</label><input id="ps" type="number" value="${p.stock}"></div></div>
 <div class="g2"><div><label>Selling price</label><input id="pp" type="number" value="${p.price}"></div><div><label>MRP (cut price)</label><input id="pm" type="number" value="${p.mrp}"></div></div>
 <label>Sizes (comma separated)</label><input id="pz" value="${esc(p.sizes.join(', '))}">
 <label>Photos (first = main; add front, back, detail…)</label><div class="imgs">${p.images.map((s,i)=>`<div><img src="${esc(s)}"><div class="c"><button onclick="mv(${i},-1)">◀</button><button onclick="rmI(${i})">✕</button><button onclick="mv(${i},1)">▶</button></div></div>`).join('')}</div><input type="file" accept="image/*" multiple onchange="addI(this)">
 <label>Videos (upload mp4/webm, max 25MB each — or paste YouTube/direct link below)</label><div class="imgs">${p.videos.map((s,i)=>`<div><video src="${esc(s)}"></video><div class="c"><button onclick="rmV(${i})">✕ remove</button></div></div>`).join('')}</div><input type="file" accept="video/mp4,video/webm" onchange="addV(this)"><div class="row"><input id="vl" placeholder="https://youtube.com/..." style="flex:1"><button class="btn o s" onclick="addVL()">Add link</button></div>
 <label>Description</label><textarea id="pd" rows="4">${esc(p.description)}</textarea>
 <label>Details (name, size in cm, fabric…)</label>${p.details.map((d,i)=>`<div class="row"><input value="${esc(d.k)}" placeholder="e.g. Length" oninput="ed.details[${i}].k=this.value" style="flex:1"><input value="${esc(d.v)}" placeholder="e.g. 72 cm" oninput="ed.details[${i}].v=this.value" style="flex:2"><button class="btn r s" onclick="ed.details.splice(${i},1);keep();pform()">✕</button></div>`).join('')}<button class="btn o s" onclick="keep();ed.details.push({k:'',v:''});pform()">+ Add detail row</button>
 <div class="row" style="margin:12px 0"><label><input type="checkbox" id="pf" ${p.featured?'checked':''}> Featured on home</label><label><input type="checkbox" id="pa" ${p.active?'checked':''}> Visible in shop</label></div>
 <div class="row"><button class="btn a" onclick="saveP()">Save product</button>${p.id?`<button class="btn r" onclick="delP()">Delete</button>`:''}</div>`;$('#mod').classList.add('on')}
function keep(){ed.name=$('#pn').value;ed.category=$('#pc').value;ed.stock=+$('#ps').value;ed.price=+$('#pp').value;ed.mrp=+$('#pm').value;ed.sizes=$('#pz').value.split(',').map(s=>s.trim()).filter(Boolean);ed.description=$('#pd').value;ed.featured=$('#pf').checked;ed.active=$('#pa').checked}
const closeM=()=>$('#mod').classList.remove('on');
async function addI(el){keep();toast('Uploading…');ed.images.push(...await upload(el.files));pform()}
async function addV(el){keep();toast('Uploading video…');ed.videos.push(...await upload(el.files));pform()}
function addVL(){keep();const v=$('#vl').value.trim();if(v)ed.videos.push(v);pform()}
function rmI(i){keep();ed.images.splice(i,1);pform()}function rmV(i){keep();ed.videos.splice(i,1);pform()}
function mv(i,d){keep();const j=i+d;if(j<0||j>=ed.images.length)return;[ed.images[i],ed.images[j]]=[ed.images[j],ed.images[i]];pform()}
async function saveP(){keep();if(!ed.name){toast('Enter a name');return}try{const r=await api(ed.id?'/api/admin/product/'+ed.id:'/api/admin/product',ed.id?'PUT':'POST',ed);const i=A.products.findIndex(x=>x.id===r.id);if(i>=0)A.products[i]=r;else A.products.unshift(r);closeM();render();toast('Saved')}catch(e){toast(e.message)}}
async function delP(){if(!confirm('Delete this product?'))return;await api('/api/admin/product/'+ed.id,'DELETE');A.products=A.products.filter(x=>x.id!==ed.id);closeM();render()}
// ---- categories ----
function categories(){$('#main').innerHTML=`<div class="box">${A.categories.map((c,i)=>`<div class="pi"><img src="${esc(c.image)}"><div><input value="${esc(c.name)}" oninput="A.categories[${i}].name=this.value" style="margin:0"><input type="file" accept="image/*" onchange="catImg(${i},this)" style="margin:4px 0 0"></div><button class="btn r s" onclick="A.categories.splice(${i},1);categories()">✕</button></div>`).join('')}
 <div class="row" style="margin-top:10px"><button class="btn o" onclick="A.categories.push({id:'',name:'New category',image:''});categories()">+ Add category</button><button class="btn a" onclick="saveCats()">Save categories</button></div></div>`}
async function catImg(i,el){const u=await upload(el.files);if(u[0]){A.categories[i].image=u[0];categories()}}
async function saveCats(){try{const r=await api('/api/admin/categories','PUT',{list:A.categories});A.categories=r.list;toast('Saved');categories()}catch(e){toast(e.message)}}
// ---- layout ----
const LT={hero:'Hero banner',categories:'Category grid',featured:'Featured products',products:'All products grid',category:'One category row',banner:'Image banner',testimonials:'Customer testimonials band',text:'Text block'};
function layout(){const s=A.settings,L=s.layout;$('#main').innerHTML=`<div class="box"><b>Look & feel</b><div class="g3" style="margin-top:8px"><div><label>Main colour</label><input type="color" id="c1" value="${s.theme.primary}"></div><div><label>Accent</label><input type="color" id="c2" value="${s.theme.accent}"></div><div><label>Background</label><input type="color" id="c3" value="${s.theme.bg}"></div></div>
 <label>Font style</label><select id="ft">${[['Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif','Modern (default)'],['Georgia, "Times New Roman", serif','Classic serif'],['"Playfair Display", Georgia, serif','Elegant serif'],['system-ui, -apple-system, Segoe UI, Roboto, sans-serif','Modern sans'],['"Trebuchet MS", Verdana, sans-serif','Friendly sans'],['"Courier New", monospace','Typewriter']].map(([v,n])=>`<option value='${esc(v)}' ${v===s.theme.font?'selected':''}>${n}</option>`).join('')}</select>
 <label>Top announcement bar</label><input id="an" value="${esc(s.announcement)}"><label>Hero title</label><input id="ht" value="${esc(s.heroTitle)}"><label>Hero subtitle</label><input id="hs" value="${esc(s.heroSub)}"><label>Hero image (shown on the right of the headline)</label><div class="row"><img src="${esc(s.heroImage)}" style="width:90px;height:60px;object-fit:cover"><input type="file" accept="image/*" style="flex:1" onchange="heroImg(this)"></div></div>
 <div class="box"><b>Promo strip</b> <span class="mut">(small offer cards under the hero, up to 4)</span>${(s.promos||[]).map((x,i)=>`<div class="row" style="margin-top:6px"><input value="${esc(x.t)}" placeholder="Title e.g. FREE DELIVERY" oninput="A.settings.promos[${i}].t=this.value" style="flex:1;margin:0"><input value="${esc(x.s)}" placeholder="Small text" oninput="A.settings.promos[${i}].s=this.value" style="flex:2;margin:0"><button class="btn r s" onclick="A.settings.promos.splice(${i},1);layout()">✕</button></div>`).join('')}${(s.promos||[]).length<4?`<div style="margin-top:8px"><button class="btn o s" onclick="(A.settings.promos=A.settings.promos||[]).push({t:'',s:''});layout()">+ Add promo</button></div>`:''}</div>
 <div class="box"><b>Home page sections</b> <span class="mut">(top to bottom)</span><div style="margin-top:8px">${L.map((x,i)=>`<div class="lay"><div class="ctl"><button class="btn o s" onclick="lmv(${i},-1)">↑</button><button class="btn o s" onclick="lmv(${i},1)">↓</button></div><div><div class="row sp"><b>${LT[x.type]}</b><label><input type="checkbox" ${x.enabled?'checked':''} onchange="L2(${i}).enabled=this.checked"> show</label></div>
 ${x.type!=='hero'?`<input placeholder="Section title" value="${esc(x.title)}" oninput="L2(${i}).title=this.value">`:'<span class="mut">Uses hero settings above</span>'}
 ${x.type==='text'||x.type==='banner'?`<textarea rows="2" placeholder="Text" oninput="L2(${i}).text=this.value">${esc(x.text)}</textarea>`:''}
 ${x.type==='banner'?`<input type="file" accept="image/*" onchange="banImg(${i},this)">${x.image?`<img src="${esc(x.image)}" style="height:50px">`:''}`:''}
 ${x.type==='category'?`<select onchange="L2(${i}).category=this.value"><option value="">Choose…</option>${A.categories.map(c=>`<option value="${c.id}" ${c.id===x.category?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`:''}</div><button class="btn r s" onclick="A.settings.layout.splice(${i},1);layout()">✕</button></div>`).join('')}</div>
 <div class="row"><select id="nt" style="width:auto">${Object.entries(LT).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><button class="btn o" onclick="A.settings.layout.push({id:'',type:$('#nt').value,title:'',text:'',enabled:true});layout()">+ Add section</button></div></div><button class="btn a" onclick="saveLayout()">Save layout & look</button>`}
const L2=i=>A.settings.layout[i];function lmv(i,d){const L=A.settings.layout,j=i+d;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];layout()}
async function heroImg(el){const u=await upload(el.files);if(u[0]){A.settings.heroImage=u[0];layout()}}async function banImg(i,el){const u=await upload(el.files);if(u[0]){L2(i).image=u[0];layout()}}
async function saveLayout(){const s=A.settings;s.theme.primary=$('#c1').value;s.theme.accent=$('#c2').value;s.theme.bg=$('#c3').value;s.theme.font=$('#ft').value;s.announcement=$('#an').value;s.heroTitle=$('#ht').value;s.heroSub=$('#hs').value;await saveS('Layout saved')}
async function saveS(m){try{await api('/api/admin/settings','PUT',A.settings);A=await api('/api/admin/all');toast(m||'Saved');render()}catch(e){toast(e.message)}}
// ---- reviews ----
function reviews(){$('#main').innerHTML=`<div class="box"><b>Customer reviews</b>${A.reviews.length?A.reviews.slice().reverse().map(r=>{const p=A.products.find(x=>x.id===r.productId);return `<div class="pi"><div><b>${esc(r.name)}</b> ${'★'.repeat(r.stars)} <span class="mut">on ${esc(p?.name||'deleted product')}</span><div>${esc(r.text)}</div>${(r.images||[]).map(i=>`<img src="${esc(i)}" style="height:50px">`).join('')}</div><button class="btn r s" onclick="delR('${r.id}')">Delete</button></div>`}).join(''):'<p class="mut">No reviews yet.</p>'}</div>
 <div class="box"><b>Add a review yourself</b> <span class="mut">(e.g. from a happy customer)</span><label>Product</label><select id="rp">${A.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><div class="g2"><div><label>Name</label><input id="rn"></div><div><label>Stars</label><select id="rs">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select></div></div><label>Text</label><textarea id="rt" rows="2"></textarea><label>Photos</label><input type="file" id="rf" accept="image/*" multiple><button class="btn a" onclick="addR()">Add review</button></div>`}
async function delR(id){if(!confirm('Delete review?'))return;await api('/api/admin/review/'+id,'DELETE');A.reviews=A.reviews.filter(r=>r.id!==id);reviews()}
async function addR(){const images=await upload($('#rf').files);await api('/api/admin/review','POST',{productId:$('#rp').value,name:$('#rn').value||'Customer',stars:+$('#rs').value,text:$('#rt').value,images});A=await api('/api/admin/all');toast('Added');reviews()}
// ---- offers ----
function offers(){$('#main').innerHTML=`<div class="box"><b>Offer codes</b>${A.coupons.map((c,i)=>`<div class="g3" style="margin-top:8px"><div><label>Code</label><input value="${esc(c.code)}" oninput="A.coupons[${i}].code=this.value.toUpperCase()"></div><div><label>% off</label><input type="number" value="${c.percent}" oninput="A.coupons[${i}].percent=+this.value"></div><div><label>Flat ₹ off</label><input type="number" value="${c.flat}" oninput="A.coupons[${i}].flat=+this.value"></div><div><label>Min order ₹</label><input type="number" value="${c.minOrder}" oninput="A.coupons[${i}].minOrder=+this.value"></div><div><label><input type="checkbox" ${c.active?'checked':''} onchange="A.coupons[${i}].active=this.checked"> Active</label></div><div><button class="btn r s" onclick="A.coupons.splice(${i},1);offers()">Remove</button></div></div>`).join('')}
 <div class="row" style="margin-top:10px"><button class="btn o" onclick="A.coupons.push({code:'NEW10',percent:10,flat:0,minOrder:0,active:true});offers()">+ Add code</button><button class="btn a" onclick="saveCp()">Save</button></div></div>`}
async function saveCp(){try{await api('/api/admin/coupons','PUT',{list:A.coupons});toast('Saved')}catch(e){toast(e.message)}}
// ---- settings ----
function settings(){const s=A.settings;$('#main').innerHTML=`<div class="box"><b>Shop & helpline</b><div class="g2" style="margin-top:8px"><div><label>Shop name</label><input id="sn" value="${esc(s.shopName)}"></div><div><label>Tagline</label><input id="st" value="${esc(s.tagline)}"></div><div><label>Helpline phone</label><input id="sp" value="${esc(s.helplinePhone)}"></div><div><label>Helpline email</label><input id="se" value="${esc(s.helplineEmail)}"></div></div><label>WhatsApp number (with country code, e.g. 919876543210)</label><input id="sw" value="${esc(s.whatsapp)}"></div>
 <div class="box"><b>Payments</b><p class="mut">Customers scan <u>your QR</u> (or use your UPI ID) and pay you directly. They enter the UTR afterwards and you confirm it under Orders. Card details are never collected on this site.</p><div class="g2"><div><label>Your UPI ID (e.g. name@okhdfcbank)</label><input id="su" value="${esc(s.upiId)}"></div><div><label>Name shown in UPI app</label><input id="sq" value="${esc(s.upiName)}"></div></div><label>Payment QR code (upload your UPI QR screenshot – customers see this at checkout)</label><div class="row">${s.upiQr?`<img src="${esc(s.upiQr)}" style="width:120px;height:120px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff">`:'<span class="mut">No QR uploaded yet</span>'}<input type="file" accept="image/*" style="flex:1" onchange="qrUp(this)">${s.upiQr?`<button class="btn r s" onclick="A.settings.upiQr='';settings()">Remove QR</button>`:''}</div><p class="mut">After uploading, tap <b>Save settings</b> below.</p><label><input type="checkbox" id="sy" ${s.upiEnabled?'checked':''}> Accept UPI</label> <label><input type="checkbox" id="sc" ${s.codEnabled?'checked':''}> Accept Cash on Delivery</label></div>
 <div class="box"><b>Help page questions</b> <span class="mut">(How do I pay, where is my order, offer code…)</span>${s.faq.map((f,i)=>`<div style="margin-top:8px"><input value="${esc(f.q)}" placeholder="Question" oninput="A.settings.faq[${i}].q=this.value"><textarea rows="2" placeholder="Answer" oninput="A.settings.faq[${i}].a=this.value">${esc(f.a)}</textarea><button class="btn r s" onclick="A.settings.faq.splice(${i},1);settings()">Remove</button></div>`).join('')}<div style="margin-top:8px"><button class="btn o" onclick="A.settings.faq.push({q:'',a:''});settings()">+ Add question</button></div></div>
 <div class="box"><b>📲 Real OTP by SMS (Fast2SMS)</b><div id="smsst" class="mut" style="margin:6px 0">Checking…</div>
 <p class="mut">With this ON, the customer gets the OTP as an SMS on their own phone (not shown on screen). Steps: 1) Sign up at fast2sms.com 2) Add ₹100 or more to the wallet 3) Open "OTP SMS" and finish KYC (Aadhaar + your website link) 4) Dev API → copy your API key and paste it below.</p>
 <label>Fast2SMS API key</label><input type="password" id="smk" placeholder="Paste API key here" autocomplete="off"><div class="row"><button class="btn a" onclick="saveSms()">Save key</button><button class="btn o" onclick="saveSms(true)">Remove key</button></div>
 <label style="margin-top:10px;display:block">Send a test OTP to my number</label><div class="row"><input id="smt" inputmode="numeric" maxlength="10" placeholder="10-digit mobile" style="flex:1;margin:0"><button class="btn o" onclick="testSms()">Send test</button></div><div id="smr" style="margin-top:6px"></div></div>
 <button class="btn a" onclick="saveShop()">Save settings</button>
 <div class="box" style="margin-top:14px"><b>Change login</b><div class="g3" style="margin-top:8px"><div><label>Old password</label><input type="password" id="po"></div><div><label>New username (optional)</label><input id="pu" value="owner"></div><div><label>New password (8+ chars)</label><input type="password" id="pn1"></div></div><button class="btn" onclick="chPw()">Change password</button> <span class="mut">You'll be logged out.</span></div>
 <div class="box"><b>Backup</b><p class="mut">All data is in the <code>data</code> folder (db.json + uploads). Copy it to keep a backup.</p></div>`;loadSms()}
async function qrUp(el){const u=await upload(el.files);if(u[0]){A.settings.upiQr=u[0];settings();toast('QR uploaded – now press Save settings')}}
async function loadSms(){try{const s=await api('/api/admin/sms');$('#smsst').innerHTML=s.configured?'<span style="color:#14532d">✔ SMS key is set (…'+esc(s.last4)+'). Customers get OTP by SMS.</span>':'<span style="color:#b3261e">✖ No key – TEST MODE: OTP is shown on the customer\'s screen. Add a key before going public.</span>';if(s.lastError)$('#smr').innerHTML='<span class="err">Last SMS error: '+esc(s.lastError)+'</span>'}catch(e){}}
async function saveSms(rm){try{await api('/api/admin/sms','PUT',{key:rm?'':$('#smk').value});$('#smk').value='';toast(rm?'Key removed':'Key saved');loadSms()}catch(e){toast(e.message)}}
async function testSms(){$('#smr').textContent='Sending…';try{const r=await api('/api/admin/sms/test','POST',{phone:$('#smt').value});$('#smr').innerHTML=r.ok?'<span style="color:#14532d">✔ Sent. Check your phone. ('+esc(r.msg)+')</span>':'<span class="err">✖ Failed: '+esc(r.msg)+'</span>'}catch(e){$('#smr').innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
async function saveShop(){const s=A.settings,v=i=>$(i).value;Object.assign(s,{shopName:v('#sn'),tagline:v('#st'),helplinePhone:v('#sp'),helplineEmail:v('#se'),whatsapp:v('#sw'),upiId:v('#su').trim(),upiName:v('#sq'),upiEnabled:$('#sy').checked,codEnabled:$('#sc').checked});await saveS('Settings saved')}
async function chPw(){try{await api('/api/admin/password','POST',{old:$('#po').value,pass:$('#pn1').value,user:$('#pu').value});toast('Changed. Login again.');logout()}catch(e){toast(e.message)}}
if(T)start();
</script></body></html>
