<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop</title>
<style>
:root{--p:#111;--a:#0b4fd8;--bg:#f0f0ee;--f:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--line:#e4e2de;--mut:#6b6b68;--s:#fff;--r1:8px;--r2:16px;--r3:22px;
--ring:0 0 0 3px color-mix(in srgb,var(--a) 30%,transparent);--e1:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);--e2:0 8px 22px rgba(0,0,0,.10);--e3:0 14px 34px color-mix(in srgb,var(--a) 24%,transparent),0 4px 10px rgba(0,0,0,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--p);font-family:var(--f);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}a{color:inherit}
:focus-visible{outline:0;box-shadow:var(--ring)}
.bar{background:var(--p);color:#fff;text-align:center;font-size:12px;padding:8px 10px;letter-spacing:.02em}
header{position:sticky;top:0;z-index:20;background:var(--s);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 16px}
.logo{font-size:24px;letter-spacing:-.02em;text-transform:uppercase;text-decoration:none;font-weight:900}
.nv{display:none;gap:22px;font-size:14px}.nv a{text-decoration:none;color:var(--mut)}.nv a:hover{color:var(--p)}
.hs{flex:1;display:none}.hs input{width:100%;border:0;background:var(--bg);border-radius:99px;padding:11px 18px;font-size:14px}.hs input:focus{box-shadow:var(--ring);outline:0}
.sp1{flex:1}
@media(min-width:800px){.nv{display:flex}.hs{display:block;max-width:520px}.sp1{display:none}}
.ib{background:none;border:0;font-size:20px;padding:6px 8px;cursor:pointer;position:relative;border-radius:99px}.ib:hover{background:var(--bg)}
.badge{position:absolute;top:-2px;right:-2px;background:var(--a);color:#fff;font-size:10px;border-radius:9px;min-width:17px;height:17px;display:grid;place-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;max-width:1180px;margin:0 auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;text-decoration:none;font-size:13px;padding:7px 15px;border:1px solid var(--p);border-radius:99px;background:transparent;cursor:pointer;transition:.15s}
.chip:hover{background:var(--s);box-shadow:var(--e1)}.chip.on{background:var(--p);color:#fff}.chip:active{transform:scale(.97)}
main{max-width:1180px;margin:0 auto;padding:0 16px 90px}
h2.t{font-weight:900;letter-spacing:-.02em;text-transform:uppercase;font-size:clamp(22px,4vw,34px);text-align:center;margin:44px 0 20px}
.btn{display:inline-block;background:var(--p);color:#fff;border:1px solid var(--p);padding:13px 28px;border-radius:99px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;text-align:center;transition:.15s}
.btn:hover{opacity:.86}.btn:active{transform:scale(.98);opacity:1;filter:brightness(.85)}.btn.a{background:var(--a);border-color:var(--a)}.btn.o{background:transparent;color:var(--p);border-color:var(--p)}.btn.o:hover{background:var(--s);opacity:1}.btn.w{width:100%}.btn[disabled]{opacity:.45;pointer-events:none}
.lnk{background:none;border:0;color:var(--a);cursor:pointer;text-decoration:none;padding:0}.lnk:hover{text-decoration:underline}
/* hero */
.hero2{display:grid;background:var(--s);border-radius:var(--r3);overflow:hidden;margin-top:6px;box-shadow:var(--e1)}
.ht{padding:30px 22px}.ht h1{margin:0 0 12px;font-size:clamp(32px,7vw,58px);line-height:1;font-weight:900;letter-spacing:-.03em;text-transform:uppercase}.ht p{color:var(--mut);margin:0 0 20px;max-width:440px}
.hi{min-height:300px;background:#e7e5e1 center/cover}
@media(min-width:800px){.hero2{grid-template-columns:1.05fr 1fr}.ht{padding:60px 48px;align-self:center}.hi{min-height:460px}}
.hst{display:flex;gap:28px;margin-top:26px}.hst b{font-size:26px;display:block;line-height:1.1}.hst span{font-size:12px;color:var(--mut)}
.promos{display:grid;gap:10px;margin:14px 0}@media(min-width:700px){.promos{grid-template-columns:repeat(3,1fr)}}
.promo{background:color-mix(in srgb,var(--a) 9%,#fff);border-radius:var(--r2);padding:14px 18px;text-align:center}.promo:nth-child(2){background:#fdecef}.promo:nth-child(3){background:#fff4d9}
.promo b{display:block;font-size:12px;letter-spacing:.08em}.promo span{font-size:12px;color:var(--mut)}
/* categories */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}@media(min-width:700px){.cats{grid-template-columns:repeat(4,1fr)}}@media(min-width:1000px){.cats{grid-template-columns:repeat(6,1fr)}}
.cat{text-decoration:none;text-align:center;display:block}.cat .im{aspect-ratio:3/4;border-radius:var(--r2);overflow:hidden;background:#ddd;box-shadow:var(--e1);transition:.25s}.cat:hover .im{box-shadow:var(--e3);transform:translateY(-3px)}.cat img{width:100%;height:100%;object-fit:cover}.cat span{display:block;margin-top:8px;font-size:14px;font-weight:600}
/* products */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 12px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{text-decoration:none;display:block;background:var(--s);border-radius:var(--r2);padding:8px 8px 12px;box-shadow:var(--e1);transition:.25s}.card:hover{box-shadow:var(--e3);transform:translateY(-3px)}
.card .im{position:relative;aspect-ratio:4/5;background:#f0eeed;border-radius:12px;overflow:hidden}.card img{width:100%;height:100%;object-fit:cover}
.card h3{font-size:14px;font-weight:600;margin:10px 4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .pr{margin:0 4px}.pr b{font-size:16px;font-weight:700}.pr s{color:var(--mut);font-size:13px;margin-left:6px}
.off{background:#fde3e3;color:#c4261d;font-size:12px;padding:2px 9px;border-radius:99px;margin-left:8px;font-weight:600}
.tag{position:absolute;top:8px;left:8px;background:var(--a);color:#fff;font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600}
.stars{color:#f5b301;letter-spacing:1px}.mut{color:var(--mut);font-size:13px}
.rh{display:flex;justify-content:space-between;align-items:end;margin:44px 0 16px}.rh h2{margin:0;font-weight:900;letter-spacing:-.02em;text-transform:uppercase;font-size:clamp(22px,4vw,34px)}
.nav2{width:38px;height:38px;border-radius:50%;border:1px solid var(--p);background:var(--s);font-size:18px;cursor:pointer;margin-left:6px}.nav2:hover{background:var(--p);color:#fff}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 2px 16px}.rail::-webkit-scrollbar{display:none}.rail .card{flex:0 0 44%;scroll-snap-align:start}@media(min-width:700px){.rail .card{flex:0 0 23.5%}}
.tools{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.tools input,.tools select{flex:1;min-width:120px;padding:11px 14px;border:1px solid var(--line);background:var(--s);border-radius:var(--r1)}
.band{background:var(--a);color:#fff;border-radius:var(--r3);padding:30px 18px;margin:44px 0}.band h2{color:#fff;margin:0 0 18px;text-align:center;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;font-size:clamp(22px,4vw,32px)}
.tq{flex:0 0 86%;scroll-snap-align:center;background:var(--s);color:var(--p);border-radius:var(--r2);padding:18px;box-shadow:var(--e2)}@media(min-width:800px){.tq{flex:0 0 31%}}.tq p{margin:8px 0}
.txt{text-align:center;max-width:620px;margin:36px auto;color:var(--mut)}
/* product */
.pd{display:grid;gap:22px;margin-top:10px}@media(min-width:850px){.pd{grid-template-columns:1.1fr 1fr;gap:36px}}
.gal{display:flex;flex-direction:column;gap:10px}@media(min-width:850px){.gal{flex-direction:row}.gal .thumbs{order:-1;flex-direction:column;overflow:visible;width:96px}}
.mainw{position:relative;flex:1;min-width:0}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:#f0eeed;border-radius:var(--r3)}.slides::-webkit-scrollbar{display:none}
.slides img{flex:0 0 100%;scroll-snap-align:center;width:100%;aspect-ratio:4/5;object-fit:cover;cursor:zoom-in}
.nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.9);border:0;width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;box-shadow:var(--e1)}.nav.l{left:8px}.nav.r{right:8px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}.dots i{width:7px;height:7px;border-radius:50%;background:#c9c7c2}.dots i.on{background:var(--p);width:20px;border-radius:9px}
.thumbs{display:flex;gap:10px;overflow-x:auto}.thumbs img{flex:none;width:72px;aspect-ratio:1;object-fit:cover;border-radius:14px;border:2px solid transparent;cursor:pointer;background:#f0eeed}@media(min-width:850px){.thumbs img{width:96px;height:112px;aspect-ratio:auto}}.thumbs img.on{border-color:var(--p)}
.info .ttl{font-size:clamp(26px,4vw,38px);font-weight:900;text-transform:uppercase;letter-spacing:-.02em;line-height:1.05;margin:4px 0 8px}
.info hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.sz{display:flex;gap:8px;flex-wrap:wrap}.sz button{min-width:54px;padding:10px 18px;border:0;background:#e9e7e3;border-radius:99px;cursor:pointer;transition:.15s}.sz button:hover{background:#dcdad5}.sz button.on{background:var(--p);color:#fff}
.buy{display:flex;gap:10px;margin-top:16px}.buy .btn{flex:1}
.qty{display:inline-flex;align-items:center;background:#e9e7e3;border-radius:99px}.qty button{width:42px;height:46px;border:0;background:none;font-size:20px;cursor:pointer}.qty span{min-width:26px;text-align:center}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-top:34px;overflow-x:auto}.tabs button{flex:1;padding:14px 10px;border:0;background:none;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}.tabs button.on{color:var(--a);border-color:var(--a)}
table.dt{width:100%;border-collapse:collapse;font-size:14px;background:var(--s);border-radius:var(--r2);overflow:hidden}.dt td{padding:12px 16px;border-bottom:1px solid var(--line)}.dt td:first-child{color:var(--mut);width:38%}
.vids{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.vids video,.vids iframe{width:100%;aspect-ratio:9/12;background:#000;border:0;border-radius:var(--r2)}
.rv{background:var(--s);border-radius:var(--r2);padding:16px;margin-bottom:12px;box-shadow:var(--e1)}.rv img{width:74px;height:74px;object-fit:cover;margin:8px 8px 0 0;border-radius:12px;cursor:zoom-in}
.bars div{display:flex;align-items:center;gap:8px;font-size:12px}.bars i{flex:1;height:7px;background:#e4e2de;border-radius:9px;position:relative;overflow:hidden}.bars i b{position:absolute;left:0;top:0;bottom:0;background:#f5b301}
.rate{font-size:30px;cursor:pointer;color:#ccc}.rate span.on{color:#f5b301}
input.t,textarea.t,select.t{width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--s);margin:5px 0 12px;border-radius:var(--r1)}input.t:focus,textarea.t:focus{border-color:var(--a);box-shadow:var(--ring);outline:0}
input.bad{border-color:#c4261d}
label{font-size:13px;color:var(--mut)}
/* lightbox */
#lb{position:fixed;inset:0;background:#000;z-index:60;display:none}#lb.on{display:block}
#lbs{position:absolute;inset:0;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pan-x pan-y pinch-zoom}
#lbs img{max-width:100%;max-height:100%}#lbs.z{display:block}#lbs.z img{max-width:none;max-height:none;width:220%}
#lb .x{position:absolute;top:10px;right:14px;color:#fff;font-size:30px;background:none;border:0;z-index:2}#lb .nav{background:rgba(255,255,255,.25);color:#fff;z-index:2}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}.ov.on{display:block}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:41;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:var(--e2)}.dr.on{transform:none}
.dr .hd{padding:16px;background:var(--s);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:800}
.dr .bd{flex:1;overflow:auto;padding:16px}.dr .ft{padding:16px;border-top:1px solid var(--line);background:var(--s)}
.ci{display:flex;gap:12px;padding:12px;margin-bottom:10px;background:var(--s);border-radius:var(--r2)}.ci img{width:72px;height:90px;object-fit:cover;border-radius:10px}.ci>div{flex:1;font-size:14px}
.row{display:flex;justify-content:space-between;margin:5px 0}
.steps{display:flex;gap:6px;margin-bottom:16px}.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--a)}
.pay{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);padding:14px;margin:8px 0;background:var(--s);cursor:pointer;border-radius:var(--r1);transition:.15s}.pay.on{border-color:var(--a);box-shadow:var(--ring)}
#map{height:280px;border-radius:var(--r1);border:1px solid var(--line);margin:6px 0}
.al{padding:11px 14px;font-size:13px;margin:10px 0;border:1px solid;border-radius:var(--r1)}
.al.ok{background:#e9f7ee;border-color:#9fd3b0;color:#14532d}.al.info{background:#e8f0fe;border-color:#a8c2f5;color:#17358f}.al.warn{background:#fff6dc;border-color:#ecd48a;color:#6b4e00}.al.bad{background:#fdeaea;border-color:#eba3a0;color:#8a1c16}
.err{color:#c4261d;font-size:13px;min-height:18px}
.faq details{background:var(--s);border-radius:var(--r1);padding:12px 16px;margin-bottom:8px}.faq summary{cursor:pointer}
.tl{display:flex;margin:18px 0}.tl div{flex:1;text-align:center;font-size:12px;color:var(--mut)}.tl div:before{content:"";display:block;width:16px;height:16px;border-radius:50%;background:#d8d6d1;margin:0 auto 6px}.tl .on{color:var(--p);font-weight:600}.tl .on:before{background:var(--a);box-shadow:var(--ring)}
footer{background:#111;color:#cfcfcb;margin-top:40px}.fi{max-width:1180px;margin:0 auto;padding:34px 16px;display:grid;gap:26px}@media(min-width:800px){.fi{grid-template-columns:1.4fr 1fr 1fr 1fr}}
footer h4{color:#fff;margin:0 0 10px;font-size:13px;letter-spacing:.1em;text-transform:uppercase}footer a{display:block;color:#cfcfcb;text-decoration:none;font-size:14px;margin:5px 0}footer a:hover{color:#fff}footer p{margin:6px 0;font-size:14px}
.fb{border-top:1px solid #2a2a2a;padding:14px 16px;text-align:center;font-size:12px;color:#8a8a86;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}.pc{border:1px solid #444;border-radius:6px;padding:3px 9px;color:#ddd}
.obar{background:var(--a);color:#fff;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 14px;font-size:13px;flex-wrap:wrap}.obar:empty{display:none}.obar a,.obar button{background:#fff;color:var(--a);border:0;border-radius:99px;padding:6px 14px;font-size:13px;cursor:pointer;text-decoration:none;font-weight:600;margin-left:4px}
body.edit [data-edit]{outline:2px dashed var(--a);outline-offset:3px;cursor:pointer;border-radius:4px}body.edit [data-edit]:hover{background:color-mix(in srgb,var(--a) 12%,transparent)}
.pe{position:absolute;right:8px;top:8px;z-index:3;background:#fff;color:var(--a);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:700;box-shadow:var(--e1)}
.em{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;display:none;align-items:center;justify-content:center;padding:16px}.em.on{display:flex}.em>div{background:#fff;border-radius:16px;padding:18px;width:min(480px,100%)}

.sticky{position:fixed;left:0;right:0;bottom:0;background:var(--s);border-top:1px solid var(--line);padding:10px 16px;z-index:15;display:flex;gap:10px}@media(min-width:850px){.sticky{display:none}}
</style></head><body>
<div class="obar" id="obar"></div>
<div class="bar" id="ann"></div>
<header><button class="ib" onclick="history.length>1&&location.hash.length>2?history.back():(location.hash='#/')" aria-label="back" style="display:none" id="back">←</button><a class="logo" href="#/" id="logo">Shop</a>
<nav class="nv"><a href="#/">Home</a><a href="#/all">Shop</a><a href="#/track">Track order</a><a href="#/help">Help</a></nav>
<form class="hs" onsubmit="event.preventDefault();hsearch()"><input id="hq" placeholder="Search for clothes…" aria-label="search"></form><span class="sp1"></span>

<button class="ib" onclick="location.hash='#/track'" aria-label="track order" style="font-size:18px">📦</button>

<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=null, cart=[];
try{const c=JSON.parse(localStorage.getItem('aura_cart')||'[]');if(Array.isArray(c))cart=c.filter(i=>i&&typeof i.id==='string'&&Number(i.qty)>0).map(i=>({k:String(i.k||i.id+'|'+(i.size||'')),id:i.id,size:String(i.size||''),qty:Math.min(20,Math.max(1,Math.round(Number(i.qty))))}))}catch{}
const money=n=>(D?.settings.currency||'₹')+Number(n).toLocaleString('en-IN');
const saveCart=()=>{try{localStorage.setItem('aura_cart',JSON.stringify(cart))}catch{};$('#cc').textContent=cart.reduce((a,i)=>a+i.qty,0);updLogin();clearTimeout(window._pt);window._pt=setTimeout(()=>{try{pingNow()}catch{}},1500)};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)};
addEventListener('error',e=>alert('Error: '+e.message));addEventListener('unhandledrejection',e=>alert('Error: '+(e.reason&&e.reason.message||e.reason)));
const put=(u,b)=>fetch(u,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error||'Error');return j});
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error||'Error');return j});
const prod=id=>D.products.find(p=>p.id===id), catOf=id=>D.categories.find(c=>c.id===id);
const disc=p=>p.mrp>p.price?Math.round((p.mrp-p.price)/p.mrp*100):0;
let EDIT=false;const TK=()=>sessionStorage.getItem('t')||'';
const E=(p,t='text')=>EDIT?` data-edit="${p}" data-t="${t}"`:'';

 $('#ann').textContent=D.settings.announcement||(EDIT?'(add an announcement)':'');$('#ann').style.display=(D.settings.announcement||EDIT)?'':'none';if(EDIT){$('#ann').dataset.edit='announcement';$('#ann').dataset.t='text';$('#logo').dataset.edit='shopName';$('#logo').dataset.t='text'}
 $('#chips').innerHTML=`<a class="chip" href="#/all" data-h="#/all">All</a>`+D.categories.map(c=>`<a class="chip" href="#/cat/${c.id}" data-h="#/cat/${c.id}">${esc(c.name)}</a>`).join('');
 const s=D.settings;$('#foot').innerHTML=`<div class="fi"><div><h4 style="font-size:20px;letter-spacing:-.01em">${esc(s.shopName)}</h4><p${E('tagline')}>${esc(s.tagline)}</p></div>

async function applyCp(){const c=$('#cp').value;try{const r=await post('/api/coupon',{code:c,subtotal:sub()});if(r.ok){co.off=r.off;co.coupon=r.code;renderDr()}else $('#ce').textContent=r.msg}catch(e){$('#ce').textContent=e.message}}

function loadLeaflet(ok,fail){if(window.L)return ok();if(!document.getElementById('lfc')){const l=document.createElement('link');l.id='lfc';l.rel='stylesheet';l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(l)}

let map,mk;function initMap(){const el=$('#map');if(!el)return;mk=null;map=null;if(!window.L){el.innerHTML='<div class="mut" style="padding:20px">Loading map…</div>';loadLeaflet(()=>initMap(),()=>{el.style.height='auto';el.innerHTML='<div class="mut" style="padding:12px">Map could not load (check internet). Use the blue GPS button above, or paste your location here:<input class="t" id="pl" placeholder="e.g. 26.4120, 90.2700 or Google Maps link" style="margin:8px 0"><button class="btn o w" onclick="pastePin()">Save this location</button></div>'});return}
 const c=co.pin||{lat:26.4,lng:90.27};map=L.map('map').setView([c.lat,c.lng],co.pin?16:5);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);
 const set=(lat,lng)=>{co.pin={lat,lng};if(mk)mk.setLatLng([lat,lng]);else{mk=L.marker([lat,lng],{draggable:true}).addTo(map);mk.on('dragend',()=>{const q=mk.getLatLng();co.pin={lat:q.lat,lng:q.lng}})}$('#pinmsg').textContent='Pin saved. Drag the marker to adjust.'};
 window._setPin=set;if(co.pin)set(c.lat,c.lng);map.on('click',e=>set(e.latlng.lat,e.latlng.lng))}
function pastePin(){const v=($('#pl').value||''),m=/(-?\d{1,2}\.\d+)\s*[,\s]\s*(-?\d{1,3}\.\d+)/.exec(decodeURIComponent(v));if(!m){$('#pinmsg').innerHTML='<span style="color:#c4261d">Could not read it. In Google Maps long-press your place, copy the two numbers shown at top (like 26.4120, 90.2700) and paste.</span>';return}co.pin={lat:+m[1],lng:+m[2]};saveAuth();$('#pinmsg').innerHTML='<span style="color:#14532d">✔ Location saved ('+m[1]+', '+m[2]+')</span>'}
function gps(){if(!navigator.geolocation){$('#pinmsg').textContent='GPS not supported on this browser. Paste your location below.';return}$('#pinmsg').textContent='Getting your location… (tap Allow if asked)';navigator.geolocation.getCurrentPosition(p=>{const{latitude:a,longitude:b}=p.coords;co.pin={lat:a,lng:b};if(map){map.setView([a,b],17);window._setPin(a,b)}else $('#pinmsg').innerHTML='<span style="color:#14532d">✔ Location captured ('+a.toFixed(4)+', '+b.toFixed(4)+')</span>'},e=>{const m={1:'Location permission is blocked. In Chrome tap the ⓘ icon next to the address, then Permissions → Location → Allow. Also turn ON your phone GPS.',2:'Phone could not find your location. Turn ON GPS / Location and try again.',3:'Location timed out. Go near a window / open sky and try again.'}[e.code]||'Could not get location.';$('#pinmsg').innerHTML='<span style="color:#c4261d">'+m+'</span>'},{enableHighAccuracy:true,timeout:20000,maximumAge:60000})}
